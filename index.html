<!doctype html><html lang="es"><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mi Tienda · Catálogo de ropa</title><meta name="description" content="Elige tus prendas y envía tu pedido directo por WhatsApp."><meta property="og:type" content="website"><meta property="og:locale" content="es_CL"><meta property="og:site_name" content="Mi Tienda"><meta property="og:title" content="Mi Tienda · Catálogo de ropa por mayor"><meta property="og:description" content="Elige tus prendas y envía tu pedido directo por WhatsApp."><meta name="twitter:card" content="summary"><meta name="theme-color" content="#0a1f44"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600&amp;display=swap"><style id="pagestyle">
/* Layout: barra de aviso naranja, cabecera fija, portada oscura con titular enorme, tira de tipos de compra, colección en cuadrícula con segunda foto al pasar el cursor, ficha con galería y carrito lateral. */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#6b6b66; --line:#e6e5e0; --tile:#f1f0ec;
  --btn-bg:#111111; --btn-fg:#ffffff;
  --accent:#d93a07; --accent-fg:#ffffff; --hot:#ff6a3d;
  --sale:#d4001a; --wa:#168a46; --wa-fg:#ffffff;
  --hero-bg:#111111; --hero-fg:#ffffff; --shade:rgba(0,0,0,.5);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e0e; --fg:#f4f4f2; --muted:#a3a3a0; --line:#2b2b2a; --tile:#1b1b1a;
  --btn-bg:#f4f4f2; --btn-fg:#111111; --accent:#ff6a3d; --accent-fg:#111111;
  --sale:#ff5266; --wa:#2bbf6a; --wa-fg:#06210f; --hero-bg:#1b1b1a; --hero-fg:#ffffff; --shade:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e0e; --fg:#f4f4f2; --muted:#a3a3a0; --line:#2b2b2a; --tile:#1b1b1a;
  --btn-bg:#f4f4f2; --btn-fg:#111111; --accent:#ff6a3d; --accent-fg:#111111;
  --sale:#ff5266; --wa:#2bbf6a; --wa-fg:#06210f; --hero-bg:#1b1b1a; --hero-fg:#ffffff; --shade:rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:16px}

/* aviso y cabecera */
.promo{background:var(--accent);color:var(--accent-fg);text-align:center;font-size:.82rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-block:9px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.barin{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.brand{font-family:var(--display);font-weight:800;font-size:1.9rem;letter-spacing:.03em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:8px;align-items:center}
.btn{background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:999px;padding:13px 26px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.82rem;text-decoration:none;display:inline-block;text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.btn.acc{background:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:9px 18px}
.btn.wa{background:var(--wa);color:var(--wa-fg);display:block;width:100%;padding:15px 24px}
.btn.wa.off{opacity:.4;cursor:not-allowed}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:.75rem;margin-left:8px;padding-inline:5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px}

/* portada */
.hero{background:var(--hero-bg);color:var(--hero-fg);padding-block:60px 56px}
.hin{display:grid;gap:16px;justify-items:start}
.eyebrow{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--hot);font-size:1.05rem}
.hero h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(3.2rem,13vw,8rem);line-height:.86;margin:0;max-width:11ch;text-wrap:balance}
.hero .sub{margin:0;max-width:44ch;opacity:.82;font-size:1.08rem}
.hb{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* tipos de compra */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0 28px;padding-block:28px 8px}
.how div{border-top:3px solid var(--fg);padding-top:12px;display:grid;gap:2px;margin-bottom:16px}
.how b{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.35rem;letter-spacing:.02em}
.how span{color:var(--muted);font-size:.93rem}

/* filtros */
.filters{display:grid;gap:14px;padding-block:28px 22px}
.frow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.sect{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:2.4rem;line-height:1;margin:0}
.sect small{font-size:1rem;color:var(--muted);font-family:var(--body);font-weight:500;margin-left:10px;letter-spacing:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 260px;justify-content:flex-end}
.tools input,.tools select,.f input,.f select,.f textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.tools input{flex:1 1 160px;max-width:300px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 18px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}

/* cuadrícula */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:34px 12px;padding-bottom:64px}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:44px 18px}}
.card{background:none;border:0;padding:0;text-align:left;display:block;min-width:0;align-self:start}
.ph{position:relative;aspect-ratio:4/5;background:var(--tile);overflow:hidden;display:block}
.ph img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .5s}
.ph img.alt{position:absolute;inset:0;opacity:0;transition:opacity .35s}
.card:hover .ph img:not(.alt){transform:scale(1.04)}
.card:hover .ph img.alt{opacity:1}
.phi{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.phi svg{width:46%}
.see{position:absolute;left:10px;right:10px;bottom:10px;background:var(--bg);color:var(--fg);text-align:center;font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding:9px;opacity:0;transform:translateY(6px);transition:.25s}
@media (hover:hover){.card:hover .see,.card:focus-visible .see{opacity:1;transform:none}}
.tag{position:absolute;left:10px;top:10px;background:var(--bg);color:var(--fg);font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;padding:2px 9px;z-index:1}
.tag.sale{background:var(--sale);color:#fff}
.info{display:block;padding-top:12px}
.pname{display:block;font-weight:600;line-height:1.25}
.pcat{display:block;color:var(--muted);font-size:.88rem}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dots i{width:13px;height:13px;border-radius:50%;border:1px solid var(--line)}
.pt{display:grid;margin-top:10px;font-variant-numeric:tabular-nums}
.pr{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:0 8px;border-top:1px solid var(--line);padding-block:6px;font-size:.92rem}
.pr span{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pr b{font-weight:600}
.pr b em{font-style:normal;font-weight:400;color:var(--muted);font-size:.74rem;margin-left:3px}
@media (max-width:699px){.pr{flex-direction:column;align-items:flex-start}.tools{flex-basis:100%}.tools input{max-width:none}.tools select{flex:none}}
.f .chk{display:flex;gap:8px;align-items:center;font-size:.9rem;font-weight:500;text-transform:none;letter-spacing:0}
.f .chk input{width:auto}
.qc{max-height:150px;overflow:auto}
.ccust{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ccust input:not([type=color]){flex:1 1 180px;width:auto}
.ccust input[type=color]{width:48px;height:42px;padding:2px;flex:none}
.crow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crow input{flex:1 1 140px;min-width:0}
.atx2{width:40px;height:42px;border:1.5px solid var(--line);background:transparent;border-radius:8px;font-size:1.1rem;flex:none}
.fin{gap:10px}
.qc{display:flex;flex-wrap:wrap;gap:6px}
.qchip{padding:5px 12px;font-size:.85rem}
.atc{width:92px;font-size:.78rem;padding:4px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg)}
.lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:60px 12px 52px}
.lb img{max-width:100%;max-height:calc(100vh - 116px);object-fit:contain;display:block}
.lbx,.lbn{position:absolute;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:50%;width:44px;height:44px;font-size:1.6rem;line-height:1}
.lbx{right:12px;top:calc(12px + env(safe-area-inset-top,0px))}
.lbn{top:50%;transform:translateY(-50%)}
.lbp{left:10px}.lbr{right:10px}
.lbc{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:.9rem}
.sold{opacity:.55}
.empty{grid-column:1/-1;padding:56px 0;color:var(--muted);text-align:center}

footer{background:var(--hero-bg);color:var(--hero-fg);padding-block:44px 52px}
.fin{display:grid;gap:12px;justify-items:start}
.fin strong{font-family:var(--display);text-transform:uppercase;font-size:2.4rem;letter-spacing:.03em;line-height:1}
.fin p{margin:0;opacity:.75}
.fin .btn.wa{width:auto;display:inline-block}

/* paneles */
.ov{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;justify-content:center;align-items:flex-end}
@media (min-width:700px){.ov{align-items:center}.ov.drawer{justify-content:flex-end;align-items:stretch}}
.panel{background:var(--bg);width:100%;max-width:980px;max-height:96%;overflow:auto;position:relative;border-radius:18px 18px 0 0}
@media (min-width:700px){.panel{max-height:92%;border-radius:0}.drawer .panel{max-width:460px;max-height:100%}}
.x{position:absolute;right:12px;top:12px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--fg);font-size:1.4rem;line-height:1;box-shadow:0 0 0 1px var(--line)}
.pd{display:grid;grid-template-columns:1fr}
@media (min-width:700px){.pd{grid-template-columns:1.1fr 1fr}}
.gal{min-width:0}
.gal .ph{aspect-ratio:auto;width:100%;min-height:280px;border:0;padding:0;display:block;cursor:zoom-in}
.gal .ph img{height:auto;max-height:78vh;margin-inline:auto}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 0}
.th{flex:none;width:62px;aspect-ratio:4/5;padding:0;border:1.5px solid transparent;background:var(--tile);overflow:hidden;opacity:.7}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.th[aria-pressed="true"]{border-color:var(--fg);opacity:1}
.pdi{padding:26px 20px 30px;display:flex;flex-direction:column;gap:18px}
.pdi h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:2.4rem;line-height:.95;margin:0;padding-right:36px}
.pdi p{margin:0}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size,.csz{min-width:52px;padding:11px 14px;border:1.5px solid var(--line);background:transparent;border-radius:8px;font-weight:500}
.size[aria-pressed="true"],.csz[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:1px solid var(--line)}
.lab{font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.err{color:var(--sale);font-size:.9rem}
.modes{display:grid;gap:8px}
.modes.two{grid-template-columns:1fr 1fr}
.vrow{border:1.5px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:10px}
.vh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.vh .sw{width:18px;height:18px}
.vh small{margin-left:auto;color:var(--accent);font-weight:600}
.vcells{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.vc{border:1.5px solid var(--line);border-radius:10px;padding:6px 6px 6px;text-align:center;transition:border-color .15s,background .15s}
.vc.on{border-color:var(--fg);background:var(--tile)}
.vs{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px}
.vstep{display:flex;align-items:center;justify-content:center;gap:2px}
.vstep button{width:32px;height:34px;border:0;background:var(--tile);border-radius:8px;font-size:1.1rem;line-height:1}
.vstep input{width:38px;height:34px;border:0;background:transparent;text-align:center;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;padding:0;color:inherit}
.vstep input::-webkit-outer-spin-button,.vstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.buy{position:sticky;bottom:0;background:var(--bg);padding:12px 0 14px;border-top:1px solid var(--line);margin-top:4px;z-index:2}
.vstep input:focus{outline:none}
.vstep:focus-within{box-shadow:0 0 0 2px var(--fg);border-radius:8px}
.whelp{display:grid;gap:8px;margin:10px 0 4px;padding:12px;border-radius:10px;background:var(--tile);font-size:.9rem}
.whelp .whb{display:flex;gap:8px;flex-wrap:wrap}
.logo{height:42px;width:auto;max-width:210px;object-fit:contain;display:block}
.lnk{background:none;border:0;color:inherit;opacity:.55;text-decoration:underline;font-size:.8rem;padding:6px 0;margin-top:6px}
.howtok{font-size:.9rem}.howtok summary{cursor:pointer;font-weight:600}.howtok ol{padding-left:20px;display:grid;gap:6px}
.logorow{display:flex;align-items:center;gap:12px}.logoprev{height:56px;width:auto;max-width:220px;object-fit:contain;background:var(--tile);padding:6px;border-radius:8px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.thm{display:inline-flex;align-items:center;gap:6px;padding:7px 14px 7px 8px;border:1.5px solid var(--line);background:transparent;border-radius:999px;font-weight:600}
.thm i{width:16px;height:16px;border-radius:50%;display:inline-block;margin-right:-2px}
.thm[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.ccust label{display:flex;align-items:center;gap:8px}
.qty input{width:56px;height:40px;border:0;background:transparent;text-align:center;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;padding:0;color:inherit}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty input:focus{outline:none}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qchips button{padding:7px 14px;border:1.5px solid var(--line);background:transparent;border-radius:999px;font-weight:600;font-size:.88rem}
.qchips button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
#qchips[hidden]{display:none}
.share{display:grid;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.share small{color:var(--muted);font-size:.82rem}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.fin .share{border-top-color:rgba(128,128,128,.35)}
.fin .share .btn{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.45)}
.fin .share .btn:hover{background:rgba(255,255,255,.12)}
.fin .share small{color:rgba(255,255,255,.65)}
.pstat{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--tile);font-weight:600;font-size:.92rem}
.pstat.ok{background:#e6f5ec;color:#14683a}
#pick[hidden],#pickGrid[hidden],#pickNote[hidden],#pickMode[hidden],#pickStat[hidden],#qwrap[hidden]{display:none}
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:13px 15px;border:1.5px solid var(--line);background:transparent;border-radius:10px}
.mode[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.mode b{display:block}
.mode small{display:block;color:var(--muted);font-size:.82rem}
.mode .mp{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px}
.qty button{width:40px;height:40px;border:0;background:none;font-size:1.2rem}
.qty span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}

.ph2{padding:22px 20px 12px}
.ph2 h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:2.1rem;margin:0;line-height:1}
.items{padding:0 20px;display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.it .ph{aspect-ratio:1;width:72px}
.it h4{margin:0;font-weight:600}
.it small{color:var(--muted);display:block}
.it .qty{margin-top:8px}
.it .qty button{width:32px;height:32px}
.lt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lt button{display:block;margin:8px 0 0 auto;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:0}
.foot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.f input,.f select,.f textarea{width:100%}
.cust{padding:16px 20px 4px;display:grid;gap:12px}
.note{color:var(--muted);font-size:.88rem}

/* administración */
.sec{padding:20px;border-bottom:1px solid var(--line);display:grid;gap:14px}
.sec h3{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.5rem;margin:0}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.athumbs{display:flex;gap:10px;flex-wrap:wrap}
.at{position:relative;width:92px;display:grid;gap:4px}
.at img{width:92px;aspect-ratio:4/5;object-fit:contain;display:block;background:var(--tile)}
.atm{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:center;color:var(--accent)}
.atb{background:none;border:0;padding:0;font-size:.78rem;text-decoration:underline;color:var(--muted)}
.atx{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--bg);color:var(--fg);line-height:1;box-shadow:0 0 0 1px var(--line)}
.pl{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pl .ph{width:48px;aspect-ratio:1}
.pl .meta{min-width:0}
.pl .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .btns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.warn{background:var(--tile);padding:12px 14px;border-radius:8px;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn-bg);color:var(--btn-fg);padding:12px 20px;border-radius:999px;z-index:70;font-weight:500;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=JSON.parse($('#data').textContent);
const cfg=D.config;
if(!cfg.categories)cfg.categories=['Hombre','Mujer','Niños','Accesorios'];
if(!cfg.contacts)cfg.contacts=[{name:'Ventas',number:cfg.whatsapp||''}];
if(!cfg.theme)cfg.theme={preset:'azul'};
if(cfg.promo===undefined)cfg.promo='Precios por mayor, docena y embalaje · Pedidos por WhatsApp';
let products=D.products;
const digits=s=>String(s||'').replace(/\D/g,'');
const contacts=()=>(cfg.contacts||[]).filter(c=>digits(c.number));
let ctIdx=0;
const initCt=()=>{try{const q=new URLSearchParams(location.search).get('v');if(q){const l=contacts();const n=parseInt(q);if(n>=1&&n<=l.length)ctIdx=n-1;else{const i=l.findIndex(c=>String(c.name||'').toLowerCase().includes(q.toLowerCase()));if(i>=0)ctIdx=i}}}catch(e){}};
const curNum=()=>{const l=contacts();return l.length?digits(l[Math.min(ctIdx,l.length-1)].number):''};
if(!cfg.unitPrices){products.forEach(p=>{if(p.sample){const dq=Number(p.dozenQty)||12,pk=Number(p.packQty)||0;if(p.dozen>0)p.dozen=Math.round(p.dozen/dq);if(p.pack>0&&pk)p.pack=Math.round(p.pack/pk)}});cfg.unitPrices=true}
const MAXPH=7;
const S={cat:'Todo',q:'',sort:'nuevo',sheet:null,sel:{size:'',color:'',qty:1,mode:'u'},isAdmin:false,dirty:false,edit:null,imgs:[],imgCol:[],phMsg:'',gi:0,lb:null,delId:null,cust:{name:'',note:''},busy:false,cache:{},rev:{}};
let cart=[];
try{cart=JSON.parse(localStorage.getItem('cart-v1')||'[]')}catch(e){}
cart=cart.filter(c=>(c.mode||'u')!=='d'||c.v===2);
const saveCart=()=>{try{localStorage.setItem('cart-v1',JSON.stringify(cart))}catch(e){}};
const money=n=>String(cfg.currency||'$').trim()+' '+String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const byId=id=>products.find(p=>p.id===id);
const catList=()=>{const out=[];[...(cfg.categories||[]),...products.map(p=>p.category)].forEach(c=>{c=String(c||'').trim();if(c&&!out.some(o=>o.toLowerCase()===c.toLowerCase()))out.push(c)});return out};
const cats=()=>['Todo',...catList()];
const PH='<span class="phi"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M35 14 L12 26 L20 44 L30 39 L30 86 L70 86 L70 39 L80 44 L88 26 L65 14 C62 22 38 22 35 14Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span>';
const srcOf=u=>S.cache[u]||u;
const imgsOf=p=>(p.imgs&&p.imgs.length?p.imgs:(p.img?[p.img]:[])).map(srcOf);
const pic=p=>{const u=imgsOf(p)[0];return u?'<img src="'+u+'" alt="'+esc(p.name)+'" loading="lazy">':PH};
const picCard=p=>{const a=imgsOf(p);return pic(p)+(a.length>1?'<img class="alt" src="'+a[1]+'" alt="" loading="lazy">':'')};
function badgeOf(p){if(p.soldOut)return '<span class="tag">Agotado</span>';if(p.badge)return '<span class="tag'+(p.badge==='Oferta'?' sale':'')+'">'+esc(p.badge)+'</span>';return ''}

const COLORS=[['Negro','#111111'],['Blanco','#ffffff'],['Marfil','#f4efe1'],['Crema','#efe6d2'],['Beige','#d8c3a0'],['Arena','#cdb891'],['Camel','#b98b4d'],['Caqui','#a99a6a'],['Café','#6b4423'],['Chocolate','#3e2a1d'],['Terracota','#c2623f'],['Gris claro','#cfcfcf'],['Gris','#8a8a8a'],['Gris oscuro','#4a4a4a'],['Plomo','#7a7f87'],['Acero','#8e9aa6'],['Grafito','#2f3237'],['Plateado','#c0c0c0'],['Celeste','#6ec1ff'],['Azul','#1f4fd8'],['Azul rey','#1b3fa0'],['Azul marino','#14213d'],['Petróleo','#0f4c5c'],['Turquesa','#16b3b3'],['Menta','#9be0c8'],['Verde','#1f8a4c'],['Verde limón','#a8d83f'],['Verde oliva','#6b7a2a'],['Verde militar','#4b5320'],['Verde botella','#0b3d2e'],['Amarillo','#f2c500'],['Mostaza','#d9a21b'],['Dorado','#c9a227'],['Naranja','#f08a1c'],['Coral','#ff6f61'],['Salmón','#fa8072'],['Rojo','#d4001a'],['Burdeo','#6d0f24'],['Vino','#6d0f24'],['Rosado','#f4a6c0'],['Rosa pastel','#f9d5e5'],['Fucsia','#d6247f'],['Morado','#6b3fa0'],['Lila','#b79ae0'],['Lavanda','#c3b1e1'],['Multicolor','multi']];
const ALIAS={beish:'beige',beis:'beige',burdeos:'burdeo',guinda:'vino',marron:'café','marrón':'café',cafe:'café',rosa:'rosado',oliva:'verde oliva'};
const HEXMAP={};COLORS.forEach(([n,h])=>{HEXMAP[n.toLowerCase()]=h});
const MULTI='conic-gradient(#d4001a,#f08a1c,#f2c500,#1f8a4c,#1f4fd8,#6b3fa0,#d4001a)';
function hex(n){const k=String(n).trim().toLowerCase();const c=(cfg.colorHex||{})[k];if(c)return c;let h=HEXMAP[k]||HEXMAP[ALIAS[k]||''];if(!h){const w=k.split(/\s+/);if(w.length>1)h=HEXMAP[w[0]]||HEXMAP[ALIAS[w[0]]||'']||''}return h||''}
const bgOf=n=>{const h=hex(n);return h==='multi'?MULTI:h};
const sw=n=>bgOf(n)?'<i class="sw" style="background:'+bgOf(n)+'"></i>':'';
const dotsOf=p=>(p.colors&&p.colors.length)?'<span class="dots">'+p.colors.map(c=>'<i title="'+esc(c)+'" style="background:'+(bgOf(c)||'var(--tile)')+'"></i>').join('')+'</span>':'';
const variantTxt=(sz,c)=>[sz?(sz==='Surtido'?'Tallas surtidas':'Talla '+sz):'',c?(c==='Surtido'?'Colores surtidos':'Color '+c):''].filter(Boolean).join(', ');

function tiers(p){const t=[],mn=Number(p.minU)||3,dq=Number(p.dozenQty)||12,pk=Number(p.packQty)||0;
  if(p.price>0)t.push({k:'u',label:'Por mayor',sub:'Desde '+mn+' unidades',unit:p.price,price:p.price,units:1,min:mn});
  if(p.dozen>0)t.push({k:'d',label:'Docena o paquete',sub:'Desde '+dq+' unidades',unit:p.dozen,price:p.dozen,units:1,min:dq});
  if(p.pack>0&&pk>0)t.push({k:'p',label:'Embalaje',sub:pk+' unidades, embalado',unit:p.pack,price:Math.round(p.pack*pk),units:pk,min:1});
  return t}
const tier=(p,k)=>{const l=tiers(p);return l.find(t=>t.k===k)||l[0]};
const uprice=p=>{const l=tiers(p).map(t=>t.unit);return l.length?Math.min(...l):0};
const isU=t=>t.k==='u'||t.k==='d';
const mixTxt=m=>(m||[]).map(x=>x.n+' × '+[x.size,x.color].filter(Boolean).join(' · ')).join('; ');
const varOf=x=>x.mix?mixTxt(x.mix):variantTxt(x.size,x.color);
const gsum=()=>Object.values(S.sel.grid||{}).reduce((a,n)=>a+n,0);
const unitsTxt=(t,q)=>t.units?(t.units*q)+(t.units*q===1?' unidad':' unidades'):q+(q>1?' paquetes':' paquete');
function priceOf(p){return '<span class="pt">'+tiers(p).map(t=>'<span class="pr"><span>'+t.label+'</span><b>'+money(t.unit)+'<em> c/u</em></b></span>').join('')+'</span>'}

function markDirty(){S.dirty=true;renderTop();const b=$('#pubbtn');if(b)b.disabled=false;const m=$('#pubmsg');if(m)m.textContent='Tienes cambios sin publicar.'}
function toast(t){const o=$('.toast');if(o)o.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ---------- tienda ---------- */
$('#root').innerHTML='<div id="promo"></div><div id="top"></div><div id="hero"></div><div class="wrap how" id="how"></div><main class="wrap" id="main"><div id="bar"></div><div class="grid" id="grid"></div></main><footer id="foot"></footer><div id="sheet"></div>';
const isWeb=()=>!window.claude&&/^https?:$/.test(location.protocol);
const baseUrl=()=>location.origin+location.pathname;
const prodUrl=id=>baseUrl()+'?p='+encodeURIComponent(id);
function shareLinks(url,text){const u=encodeURIComponent(url),t=encodeURIComponent(text+' '+url);return [['WhatsApp','https://wa.me/?text='+t],['Facebook','https://www.facebook.com/sharer/sharer.php?u='+u],['Telegram','https://t.me/share/url?url='+u+'&text='+encodeURIComponent(text)],['X','https://twitter.com/intent/tweet?text='+t]]}
function shareHtml(url,text,title){
  if(!isWeb())return '';
  return '<div class="share"><b>'+title+'</b><div class="sbtns">'+(navigator.share?'<button class="btn sm" data-a="shnative" data-u="'+esc(url)+'" data-t="'+esc(text)+'" type="button">Compartir</button>':'')+shareLinks(url,text).map(l=>'<a class="btn ghost sm" href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>').join('')+'<button class="btn ghost sm" data-a="shcopy" data-u="'+esc(url)+'" type="button">Copiar enlace</button></div><small>Para Instagram o TikTok: copia el enlace y pégalo en tu biografía o en un sticker de enlace.</small></div>';
}

/* ---------- tema ---------- */
const THEMES={azul:['Azul','#1d4ed8','#0a1f44'],celeste:['Celeste','#0284c7','#082f49'],naranja:['Naranja','#d93a07','#111111'],verde:['Verde','#15803d','#052e16'],morado:['Morado','#7e22ce','#2e1065'],rojo:['Rojo','#dc2626','#450a0a']};
const mixW=(h,k)=>{const n=parseInt(h.slice(1),16),c=[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v+(255-v)*k));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')};
function themeVals(){const t=cfg.theme||{preset:'azul'};if(t.preset&&t.preset!=='custom'&&THEMES[t.preset])return{a:THEMES[t.preset][1],g:THEMES[t.preset][2]};return{a:/^#[0-9a-f]{6}$/i.test(t.accent)?t.accent:'#1d4ed8',g:/^#[0-9a-f]{6}$/i.test(t.hero)?t.hero:'#0a1f44'}}
function applyTheme(){const v=themeVals(),a=v.a,g=v.g,h=mixW(a,.35);let st=document.getElementById('themestyle');if(!st){st=document.createElement('style');st.id='themestyle';document.body.appendChild(st)}
  st.textContent=':root{--accent:'+a+';--accent-fg:#fff;--hot:'+h+';--hero-bg:'+g+';--btn-bg:'+g+'}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:'+h+';--accent-fg:#071433;--hot:'+h+';--hero-bg:'+g+'}}';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=g}

/* ---------- GitHub ---------- */
const b64=t=>btoa(unescape(encodeURIComponent(t)));
const GH={
  br:'main',
  tok(){try{return localStorage.getItem('gh-token')||''}catch(e){return ''}},
  setTok(t){try{t?localStorage.setItem('gh-token',t):localStorage.removeItem('gh-token')}catch(e){}},
  repo(){const m=location.hostname.match(/^([^.]+)\.github\.io$/);const seg=location.pathname.split('/').filter(Boolean)[0]||'';let o=m?m[1]:'',r=(seg&&!/\.html?$/i.test(seg))?seg:(m?o+'.github.io':'');try{const ov=JSON.parse(localStorage.getItem('gh-repo')||'null');if(ov&&ov.o&&ov.r){o=ov.o;r=ov.r}}catch(e){}return{o,r}},
  hdr(extra){return Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH.tok(),'X-GitHub-Api-Version':'2022-11-28'},extra||{})},
  async api(p,opt){opt=opt||{};const rr=GH.repo();const res=await fetch('https://api.github.com/repos/'+rr.o+'/'+rr.r+p,{method:opt.method||'GET',headers:GH.hdr(opt.body?{'Content-Type':'application/json'}:null),body:opt.body});if(!res.ok){const e=new Error('GH '+res.status);e.status=res.status;throw e}return res.status===204?null:res.json()},
  async sha(p){try{return (await GH.api('/contents/'+p+'?ref='+encodeURIComponent(GH.br))).sha}catch(e){if(e.status===404)return null;throw e}},
  async put(p,content,msg){let last;for(let k=0;k<3;k++){try{const sha=await GH.sha(p);return await GH.api('/contents/'+p,{method:'PUT',body:JSON.stringify(Object.assign({message:msg,content:content,branch:GH.br},sha?{sha:sha}:{}))})}catch(e){last=e;if(e.status!==409&&e.status!==422)throw e;await new Promise(r=>setTimeout(r,700))}}throw last}
};
function ghErr(e){const st=e&&e.status;if(e&&e.perm||st===403)return 'El código no tiene permiso para escribir en este repositorio. Al crearlo, en Permissions → Contents elige Read and write.';if(st===401)return 'El código no es válido o ya venció. Crea uno nuevo.';if(st===404)return 'No encuentro ese repositorio. Revisa usuario/nombre y que el código tenga acceso a ese repositorio.';return 'No se pudo conectar con GitHub. Revisa tu internet e inténtalo otra vez.'}
function applyData(d){Object.assign(cfg,d.config||{});products=d.products||[];if(!cfg.categories)cfg.categories=['Hombre','Mujer','Niños','Accesorios'];if(!cfg.contacts)cfg.contacts=[{name:'Ventas',number:cfg.whatsapp||''}];if(!cfg.theme)cfg.theme={preset:'azul'};applyTheme()}
async function pullData(){const rr=GH.repo();const res=await fetch('https://api.github.com/repos/'+rr.o+'/'+rr.r+'/contents/data/catalogo.json?ref='+encodeURIComponent(GH.br),{headers:GH.hdr({'Accept':'application/vnd.github.raw'})});if(res.status===404)return;if(!res.ok){const e=new Error('GH');e.status=res.status;throw e}applyData(await res.json())}
async function enterAdmin(){const info=await GH.api('');if(info.permissions&&info.permissions.push===false){const e=new Error('perm');e.perm=1;throw e}GH.br=info.default_branch||'main';await pullData();S.isAdmin=true;renderTop();renderBar();renderGrid()}
function renderTop(){
  const n=cart.reduce((a,i)=>a+i.qty,0);
  $('#promo').innerHTML=cfg.promo?'<div class="promo"><div class="wrap">'+esc(cfg.promo)+'</div></div>':'';
  $('#top').innerHTML='<div class="wrap barin"><span class="brand">'+(cfg.logo?'<img class="logo" src="'+esc(srcOf(cfg.logo))+'" alt="'+esc(cfg.storeName)+'">':esc(cfg.storeName))+'</span><div class="acts">'+
    (S.isAdmin?'<button class="btn ghost sm" data-a="admin">Administrar'+(S.dirty?'<span class="dot" title="Cambios sin publicar"></span>':'')+'</button>':'')+
    '<button class="btn sm" data-a="cart" aria-label="Abrir carrito">Carrito<span class="count">'+n+'</span></button></div></div>';
  $('#hero').innerHTML='<section class="hero"><div class="wrap hin"><p class="eyebrow">Venta por mayor</p><h1>'+esc(cfg.bannerTitle)+'</h1><p class="sub">'+esc(cfg.bannerText)+'</p><div class="hb"><button class="btn acc" data-a="shop">Ver colección</button></div></div></section>';
  $('#how').innerHTML='<div><b>Por mayor</b><span>Desde 3 unidades. Mezcla tallas y colores.</span></div><div><b>Docena o paquete</b><span>Desde 12 unidades. Surtido o eliges tú.</span></div><div><b>Embalaje</b><span>Embalaje cerrado, el mayor volumen.</span></div>';
  const num=curNum();
  $('#foot').innerHTML='<div class="wrap fin"><strong>'+esc(cfg.storeName)+'</strong><p>Haz tu pedido y lo confirmamos por WhatsApp. Precios en pesos chilenos (CLP).</p>'+contacts().map(c=>'<a class="btn wa" href="https://wa.me/'+digits(c.number)+'" target="_blank" rel="noopener">'+(contacts().length>1?'WhatsApp · '+esc(c.name||'Ventas'):'Escríbenos por WhatsApp')+'</a>').join('')+shareHtml(baseUrl(),'Mira el catálogo de '+(cfg.storeName||'nuestra tienda'),'Comparte este catálogo')+(isWeb()&&!S.isAdmin?'<button class="lnk" data-a="login" type="button">Acceso tienda</button>':'')+'</div>';
}
function renderBar(){
  $('#bar').innerHTML='<div class="filters"><div class="frow"><h2 class="sect">Colección<small id="cnt"></small></h2><div class="tools"><input id="q" type="search" placeholder="Buscar prenda" aria-label="Buscar prenda" value="'+esc(S.q)+'"><select id="sort" aria-label="Ordenar"><option value="nuevo"'+(S.sort==='nuevo'?' selected':'')+'>Novedades</option><option value="menor"'+(S.sort==='menor'?' selected':'')+'>Precio: menor a mayor</option><option value="mayor"'+(S.sort==='mayor'?' selected':'')+'>Precio: mayor a menor</option></select></div></div>'+
    '<div class="chips" role="group" aria-label="Categorías">'+cats().map(c=>'<button class="chip" data-a="cat" data-v="'+esc(c)+'" aria-pressed="'+(c===S.cat)+'">'+esc(c)+'</button>').join('')+'</div></div>';
}
function renderGrid(){
  let l=products.filter(p=>(S.cat==='Todo'||p.category===S.cat)&&(!S.q||(p.name+' '+p.category).toLowerCase().includes(S.q.toLowerCase())));
  if(S.sort==='menor')l=[...l].sort((a,b)=>uprice(a)-uprice(b));
  if(S.sort==='mayor')l=[...l].sort((a,b)=>uprice(b)-uprice(a));
  $('#grid').innerHTML=l.length?l.map(p=>'<button class="card'+(p.soldOut?' sold':'')+'" data-a="open" data-id="'+p.id+'"><span class="ph">'+picCard(p)+badgeOf(p)+'<span class="see">Ver opciones</span></span><span class="info"><span class="pname">'+esc(p.name)+'</span><span class="pcat">'+esc(p.category)+'</span>'+dotsOf(p)+priceOf(p)+'</span></button>').join(''):
    '<p class="empty">'+(products.length?'No hay prendas con ese filtro.':'Aún no hay productos. Pronto verás aquí la colección.')+'</p>';
  const c=$('#cnt');if(c)c.textContent=l.length+(l.length===1?' prenda':' prendas');
}

/* ---------- paneles ---------- */
function cartItems(){return cart.map((c,i)=>{const p=byId(c.pid);return p&&{i,p,size:c.size,color:c.color||'',mix:c.mix,qty:c.qty,t:tier(p,c.mode||'u')}}).filter(x=>x&&x.t)}
function shortages(){const m={};cartItems().forEach(x=>{if(isU(x.t)){const key=x.p.id+x.t.k;const o=m[key]||(m[key]={p:x.p,t:x.t,have:0,min:x.t.min});o.have+=x.qty}});return Object.values(m).filter(o=>o.have<o.min)}
function waText(){
  const its=cartItems();const tot=its.reduce((a,x)=>a+x.t.price*x.qty,0);
  let m='Hola, quiero hacer este pedido:\n\n'+its.map(x=>'• '+(isU(x.t)?x.qty+(x.qty===1?' unidad':' unidades')+' · '+x.t.label:x.qty+' x '+x.t.label+(x.t.units>1?' de '+x.t.units:''))+' — '+x.p.name+(varOf(x)?' ('+varOf(x)+')':'')+' — '+money(x.t.price*x.qty)).join('\n')+'\n\nTotal: '+money(tot);
  if(S.cust.name)m+='\nNombre: '+S.cust.name;
  if(S.cust.note)m+='\nNotas: '+S.cust.note;
  return m;
}
function waLink(){return 'https://wa.me/'+curNum()+'?text='+encodeURIComponent(waText())}
const fmtNum=n=>{const d=String(n||'').replace(/\D/g,'');return d.length===11&&d.startsWith('56')?'+56 '+d[2]+' '+d.slice(3,7)+' '+d.slice(7):'+'+d};
function pickHtml(p){
  const sz=(p.sizes||[]).length?p.sizes:[''],co=(p.colors||[]).length?p.colors:[''];
  let h='<div id="pick"><div id="pickMode" class="modes two" hidden><button class="mode" data-a="pick" data-v="0"><span><b>Surtido</b><small>Tallas y colores variados</small></span></button><button class="mode" data-a="pick" data-v="1"><span><b>Elegir yo</b><small>Escojo tallas y colores</small></span></button></div>';
  h+='<div id="pickNote" class="note" hidden></div><div id="pickGrid">';
  h+='<div class="lab" id="pickLab">Elige tallas y colores</div><p class="note" style="margin:4px 0 10px">Toca + en cada talla para sumar unidades. Puedes mezclar colores y tallas.</p>';
  co.forEach((c,ci)=>{
    h+='<div class="vrow" data-ci="'+ci+'"><div class="vh">'+(c?sw(c)+'<b>'+esc(c)+'</b>':'<b>Unidades</b>')+'<small class="vsub" data-ci="'+ci+'"></small></div><div class="vcells">';
    sz.forEach((s2,si)=>{h+='<div class="vc" data-k="'+si+'|'+ci+'">'+(s2?'<span class="vs">'+esc(s2)+'</span>':'')+'<div class="vstep"><button type="button" data-a="gm" data-k="'+si+'|'+ci+'" data-d="-1" aria-label="Menos '+esc(s2+' '+c)+'">−</button><input type="number" inputmode="numeric" min="0" max="999" value="0" data-gk="'+si+'|'+ci+'" aria-label="Cantidad '+esc((s2+' '+c).trim())+'"><button type="button" data-a="gm" data-k="'+si+'|'+ci+'" data-d="1" aria-label="Más '+esc(s2+' '+c)+'">+</button></div></div>'});
    h+='</div></div>';
  });
  h+='</div><div class="pstat" id="pickStat" aria-live="polite"></div><p class="err" id="pickErr" hidden></p></div>';

function renderSheet(){
  const el=$('#sheet');const sh=S.sheet;
  if(!sh){el.innerHTML='';document.body.style.overflow='';return}
  const old=el.querySelector('.panel');const keep=old&&old.dataset.t===sh.t?old.scrollTop:0;
  let inner='';

  else if(sh.t==='cart')inner=sheetCart();
  else if(sh.t==='login')inner=sheetLogin();

function resizeLogo(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(file)})}

async function publish(){
  if(S.busy)return;const btn=$('#pubbtn');
  const say=t=>{const m=$('#pubmsg');if(m)m.textContent=t};
  if(!GH.tok()){say('Primero entra con tu acceso de administrador.');return}
  S.busy=true;if(btn)btn.disabled=true;
  try{
    const ts=Date.now().toString(36);let n=0;
    if(cfg.logo&&String(cfg.logo).startsWith('data:')){
      if(S.rev[cfg.logo])cfg.logo=S.rev[cfg.logo];
      else{say('Subiendo logo…');const d=cfg.logo,pth='fotos/logo-'+ts+'.png';await GH.put(pth,d.split(',')[1],'Logo');S.cache[pth]=d;S.rev[d]=pth;cfg.logo=pth}
    }
    for(const p of products){
      delete p.sample;
      if(!p.imgs)p.imgs=p.img?[p.img]:[];delete p.img;
      for(let i=0;i<p.imgs.length;i++){
        let u=p.imgs[i];
        if(S.rev[u]){p.imgs[i]=S.rev[u];continue}
        if(String(u).startsWith('data:')){
          say('Subiendo foto '+(++n)+'…');
          const pth='fotos/'+p.id+'-'+ts+'-'+i+'.jpg';
          await GH.put(pth,u.split(',')[1],'Foto de producto');
          S.cache[pth]=u;S.rev[u]=pth;p.imgs[i]=pth;
        }
      }
    }
    say('Guardando productos…');
    await GH.put('data/catalogo.json',b64(JSON.stringify({config:cfg,products},null,1)),'Actualizar catálogo');
    if(!D.external){say('Dejando la página liviana…');await GH.put('index.html',b64(buildDoc(true,true)),'Página liviana');D.external=true}
    S.dirty=false;
    say('Guardado. Tus clientes lo verán en 1 o 2 minutos.');
  }catch(e){say(ghErr(e));if(btn)btn.disabled=false}
  S.busy=false;renderTop();
}

});
document.addEventListener('keydown',e=>{
  if(S.lb!=null){if(e.key==='Escape')A.lbclose();else if(e.key==='ArrowLeft')lbGo(-1);else if(e.key==='ArrowRight')lbGo(1);return}
  if(e.key==='Escape'&&S.sheet)A.close()});
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.target.closest('#lb')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null||S.lb==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)lbGo(dx<0?1:-1)},{passive:true});

function start(){
  initCt();document.title=(cfg.storeName||'Catálogo')+' · Catálogo de ropa';
  renderTop();renderBar();renderGrid();
  try{const pid=new URLSearchParams(location.search).get('p');if(pid&&byId(pid))A.open({dataset:{id:pid}})}catch(e){}
}
if(D.external){
  start();$('#grid').innerHTML='<p class="empty">Cargando catálogo…</p>';
  fetch('data/catalogo.json?t='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{applyData(d);start()}).catch(()=>{$('#grid').innerHTML='<p class="empty">No se pudo cargar el catálogo. Recarga la página.</p>'});
}else{applyTheme();start()}
(async()=>{if(!GH.tok()||window.claude)return;try{await enterAdmin()}catch(e){if(e&&e.status===401)GH.setTok('')}})();
</script></body></html>
